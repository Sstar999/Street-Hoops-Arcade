<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Street Hoops Arcade</title>
<style>

    padding: calc(12px + var(--it)) calc(12px + var(--ir)) calc(14px + var(--ib)) calc(12px + var(--il)); }
  .ov.hidden { opacity: 0; pointer-events: none; }
  .ov.center { justify-content: center; background: rgba(6,8,20,.72); }
  .logo { text-align: center; margin-top: 8px; pointer-events: none; }
  .logo h1 { margin: 0; font-size: clamp(34px, 11vw, 52px); line-height: .9; color: #fff; letter-spacing: 1px; text-transform: uppercase; text-shadow: 3px 3px 0 var(--org2), 6px 6px 0 #000; }
  .logo h1 em { font-style: normal; color: var(--yel); display: block; text-shadow: 3px 3px 0 var(--org2), 6px 6px 0 #000; }
  .logo p { margin: 12px 0 0; color: var(--cy); font-size: 15px; letter-spacing: 3px; text-shadow: 2px 2px 0 #000; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .menu, .card { width: min(400px, 100%); }
  .card { background: var(--panel); border: 4px solid #fff; box-shadow: 0 0 0 4px #000, 0 8px 0 4px #000; padding: 14px 12px 12px; text-align: center; max-height: 100%; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; }
  .card h2 { margin: 0 0 6px; font-size: 24px; color: var(--yel); letter-spacing: 1px; text-shadow: 2px 2px 0 #000; text-transform: uppercase; }
  .card h3 { margin: 12px 0 6px; font-size: 12px; letter-spacing: 2px; color: var(--cy); text-align: left; text-transform: uppercase; }
  .sub { font-size: 13px; color: #b9c0ee; margin: 4px 0 8px; line-height: 1.35; }
  .btn { display: block; width: 100%; font: inherit; font-weight: 900; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; color: #fff; background: var(--org); border: 3px solid #fff; padding: 11px 8px; margin-top: 9px; cursor: pointer; box-shadow: 0 5px 0 #000, inset 0 -5px 0 rgba(0,0,0,.25), inset 0 4px 0 rgba(255,255,255,.25); text-shadow: 2px 2px 0 rgba(0,0,0,.45); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #000, inset 0 -5px 0 rgba(0,0,0,.25); }
  .btn.blue { background: #3d7be0; } .btn.green { background: #2fbf6a; } .btn.purple { background: #8a52e0; } .btn.gray { background: #4b5380; font-size: 15px; padding: 9px; }
  .btn small { display: block; font-size: 11px; opacity: .9; letter-spacing: 0; margin-top: 2px; text-transform: none; }
  .row { display: flex; gap: 8px; } .row .btn { margin-top: 9px; }
  #rank { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--yel); font-size: 13px; margin: 0 0 4px; text-shadow: 2px 2px 0 #000; }
  #hav { width: 44px; height: 44px; object-fit: contain; border: 3px solid #fff; background: #3d7be0; display: none; image-rendering: auto; }
  .bar { height: 10px; background: #0b0d1a; border: 2px solid #fff; margin: 3px 0 6px; } .bar i { display: block; height: 100%; background: var(--grn); }
  .stages { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .stg { font: inherit; font-weight: 900; background: var(--panel2); border: 3px solid #5a6190; color: #fff; padding: 7px 2px 6px; cursor: pointer; font-size: 10px; line-height: 1.15; box-shadow: 0 3px 0 #000; }
  .stg b { display: block; font-size: 20px; color: var(--yel); } .stg .s { color: var(--yel); font-size: 14px; letter-spacing: 1px; min-height: 16px; } .stg .s .o { color: #4a5080; }
  .stg.lock { opacity: .45; } .stg.next { border-color: var(--grn); animation: blink 1.2s steps(2) infinite; }
  .chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .chip { font: inherit; font-weight: 900; font-size: 11px; background: var(--panel2); border: 3px solid #5a6190; color: #fff; padding: 7px 2px; cursor: pointer; box-shadow: 0 3px 0 #000; }
  .chip.on { border-color: var(--yel); background: #5a4a1a; } .chip.lock { opacity: .5; } .chip small { display: block; font-size: 9px; color: #b9c0ee; margin-top: 2px; }

  .note { font-size: 11px; color: #b9c0ee; text-align: left; margin-top: 8px; line-height: 1.4; }
  .tog { font: inherit; font-weight: 900; min-width: 64px; padding: 6px 10px; border: 3px solid #fff; background: #2fbf6a; color: #fff; cursor: pointer; box-shadow: 0 3px 0 #000; } .tog.off { background: #6b3040; }

  .tbtn { position: fixed; top: calc(8px + var(--it)); z-index: 8; width: 38px; height: 38px; border: 3px solid #fff; background: rgba(11,13,26,.85); color: #fff; font: 900 16px var(--mono); cursor: pointer; padding: 0; box-shadow: 0 3px 0 #000; }
  #snd { right: calc(8px + var(--ir)); } #pausebtn { right: calc(52px + var(--ir)); }

</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="inset"></div>

<div id="home" class="ov">
  <div class="logo"><h1>STREET<em>HOOPS</em></h1><p>PRESS START</p></div>
  <div class="menu">
    <div id="rank"><img id="hav" alt=""><span id="ranktxt"></span></div>
    <div class="bar"><i id="rankbar" style="width:0"></i></div>
    <button class="btn" id="b-arc">ARCADE<small id="arcsub">60 SECONDS &bull; BEAT YOUR HIGH SCORE</small></button>
    <div class="row">
      <button class="btn blue" id="b-tour">STREET TOUR<small id="toursub">12 COURTS</small></button>
      <button class="btn green" id="b-daily">DAILY<small id="dailysub">NEW EVERY DAY</small></button>
    </div>
    <div class="row">
      <button class="btn purple" id="b-lock" style="font-size:15px">LOCKER</button>
      <button class="btn gray" id="b-lb" style="font-size:15px">LEADERBOARD</button>
      <button class="btn gray" id="b-set" style="font-size:15px;width:56px;flex:none">&#9881;</button>
    </div>
  </div>
</div>

<div id="tour" class="ov center hidden">
  <div class="card">
    <h2>STREET TOUR</h2>
    <p class="sub" id="tourinfo"></p>
    <div class="stages" id="stages"></div>
    <button class="btn gray" id="t-back">BACK</button>
  </div>
</div>

<div id="lock" class="ov center hidden">
  <div class="card">
    <h2>LOCKER ROOM</h2>
    <h3>BALL <span style="opacity:.7">(UNLOCK WITH POINTS)</span></h3><div class="chips" id="l-ball"></div>
    <h3>JERSEY <span style="opacity:.7">(UNLOCK WITH STARS)</span></h3><div class="chips" id="l-jer"></div>
    <h3>COURT <span style="opacity:.7">(UNLOCK WITH STARS)</span></h3><div class="chips" id="l-court"></div>
    <button class="btn gray" id="l-back">BACK</button>
  </div>
</div>

<div id="set" class="ov center hidden">
  <div class="card">
    <h2>SETTINGS</h2>
    <div class="setrow"><span>SOUND FX</span><button class="tog" id="s-snd">ON</button></div>
    <div class="setrow"><span>MUSIC</span><button class="tog" id="s-mus">ON</button></div>
    <div class="setrow"><span>MY BITMOJI</span><button class="tog" id="s-bm">ON</button></div>
    <p class="note" id="s-note"></p>
    <button class="btn gray" id="s-back">BACK</button>
  </div>
</div>

<div id="pause" class="ov center hidden">
  <div class="card">
    <h2>PAUSED</h2>
    <button class="btn" id="p-resume">RESUME</button>
    <button class="btn blue" id="p-restart">RESTART</button>
    <button class="btn gray" id="p-menu">QUIT TO MENU</button>
  </div>
</div>

<div id="res" class="ov center hidden">
  <div class="card">
    <p id="rtitle">TIME UP!</p>
    <div id="rscore">0</div>
    <div id="rstars"></div>
    <div class="rec" id="rrec"></div>
    <div class="stats"><div><b id="r-m">0</b>MAKES</div><div><b id="r-s">0</b>SWISHES</div><div><b id="r-st">0</b>BEST STREAK</div></div>
    <p class="sub" id="rbest"></p>
    <button class="btn" id="r-again">PLAY AGAIN</button>
    <button class="btn green gone" id="r-next">NEXT COURT</button>
    <div class="row"><button class="btn gray" id="r-lb">LEADERBOARD</button><button class="btn gray" id="r-home">MENU</button></div>
  </div>
</div>

<button class="tbtn gone" id="pausebtn" aria-label="Pause">II</button>
<button class="tbtn" id="snd" aria-label="Sound">&#9835;</button>

  ell(g.x, g.y, 10 * sc * (1 - D.h * 0.3), 3 * sc, 'rgba(0,0,0,.3)');
  const o = { jersey: (sel.jersey + 3) % 6, skin: D.skin, hair: D.hair, run: false, crouch: 0 };
  if (D.st === 'jump') { o.hx = f.x; o.hy = f.y - 78 * sc; }
  else if (D.st === 'reach') { o.hx = f.x + Math.sign(player.x - D.x) * 6 * sc; o.hy = f.y - 30 * sc; }
  else { o.hx = f.x; o.hy = f.y - 36 * sc; o.crouch = 0.5 + 0.3 * Math.sin(clock * 6); }
  drawPlayer(f, sc, o);
  if (D.st === 'tele' && Math.floor(clock * 10) % 2 === 0) px(D.kind === 'jump' ? '!' : '?!', f.x, f.y - 80 * sc, 2, '#ff4f5a', 'c', '#000');
}

/* ---------- UI ---------- */
const SCREENS = ['home', 'tour', 'lock', 'set', 'pause', 'res'];
let musicPref = true;

function setTop() { const playing = state === 'play' || state === 'count'; $('pausebtn').classList.toggle('gone', !playing); }
function goHome() {

  refreshHome(); showScreen('home');
}
function refreshHome() {
  const r = rankInfo(); $('ranktxt').textContent = r.t + ' • ' + fmt(r.tot) + ' PTS' + (totalStars() ? ' • ' + totalStars() + '/39 \u2605' : '');
  $('rankbar').style.width = (r.next ? clamp((r.tot - RANKS[r.i].n) / (r.next - RANKS[r.i].n), 0, 1) * 100 : 100) + '%';
  const ba = Store.get('ba', 0) | 0; $('arcsub').textContent = ba ? '60 SECONDS • BEST ' + fmt(ba) : '60 SECONDS • BEAT YOUR HIGH SCORE';
  $('toursub').textContent = totalStars() + '/39 \u2605';
  const db = Store.get('db', { d: 0, s: 0 }), ds = Store.get('dstreak', 0) | 0, today = db.d === dayKey();
  $('dailysub').textContent = today ? 'TODAY ' + fmt(db.s) + (ds > 1 ? ' • ' + ds + ' DAY STREAK' : '') : (ds ? ds + ' DAY STREAK • PLAY!' : 'NEW EVERY DAY');
  $('b-lb').classList.toggle('gone', !can('leaderboards'));
  if (bm.img) { $('hav').src = bm.img.src; $('hav').style.display = bm.on ? 'block' : 'none'; } else $('hav').style.display = 'none';
}
function refreshSettingsNote() {
  const t = { ready: 'YOUR BITMOJI PLAYS FOR YOU.', noavatar: 'NO BITMOJI FOUND ON THIS ACCOUNT.', loading: 'LOADING YOUR BITMOJI...', unavailable: 'BITMOJI SHOWS UP INSIDE SNAPCHAT. HIGH SCORES SYNC TO THE LEADERBOARD THERE.', none: '' }[bm.status] || '';
  $('s-note').textContent = t + (stMode ? ' PROGRESS SAVING: ' + String(stMode).toUpperCase() + '.' : '');
  refreshHome();
}
function setTog(id, on) { const b = $(id); b.textContent = on ? 'ON' : 'OFF'; b.classList.toggle('off', !on); }
function applySettings() { setTog('s-snd', !muted); setTog('s-mus', musicPref); setTog('s-bm', bm.on); $('snd').style.opacity = muted ? 0.45 : 1; }

function tourScreen() {
  const st = (Store.get('st', []) || []), sb = (Store.get('sb', []) || []); const box = $('stages'); box.innerHTML = '';
  let nextOpen = -1; for (let i = 0; i < STAGES.length; i++) { if (!(st[i] > 0)) { nextOpen = i; break; } }
  STAGES.forEach((s, i) => {
    const open = i === 0 || st[i - 1] > 0; const b = document.createElement('button'); b.className = 'stg' + (open ? '' : ' lock') + (i === nextOpen ? ' next' : '');
    const n = st[i] | 0; b.innerHTML = '<b>' + (i + 1) + '</b>' + s.n + '<div class="s">' + '\u2605'.repeat(n) + '<span class="o">' + '\u2605'.repeat(3 - n) + '</span></div>' + (sb[i] ? '<div>BEST ' + sb[i] + '</div>' : '<div>' + (open ? 'GOAL ' + s.tg[0] : 'LOCKED') + '</div>');
    b.onclick = () => { if (!open) { sfx.miss(); return; } unlockAudio(); sfx.ui(); startRun(stageCfg(i)); }; box.appendChild(b);
  });
  $('tourinfo').textContent = 'CLEAR EACH COURT TO UNLOCK THE NEXT. EARN STARS TO UNLOCK COURTS & JERSEYS.'; showScreen('tour');
}
function chipCanvas(draw) { const c = document.createElement('canvas'); c.width = 28; c.height = 28; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; const o = ctx; return c; }
function lockerScreen() {
  const mk = (box, arr, openFn, selKey, label, thumb, req) => {
    const el = $(box); el.innerHTML = '';
    arr.forEach((it, i) => {
      const open = openFn(i), b = document.createElement('button'); b.className = 'chip' + (sel[selKey] === i ? ' on' : '') + (open ? '' : ' lock');
      const sw = document.createElement('div'); sw.style.cssText = 'width:28px;height:28px;margin:0 auto 4px;border:2px solid #fff;image-rendering:pixelated;background:' + thumb(it); b.appendChild(sw);
      b.appendChild(document.createTextNode(label(it))); const sm = document.createElement('small'); sm.textContent = open ? (sel[selKey] === i ? 'EQUIPPED' : 'OWNED') : req(i); b.appendChild(sm);
      b.onclick = () => { if (!open) { sfx.miss(); return; } sel[selKey] = i; Store.set('sel', { ball: sel.ball, jersey: sel.jersey, court: sel.court }); bgCache = null; sfx.ui(); lockerScreen(); };
      el.appendChild(b);

  const bc = c => 'radial-gradient(circle at 35% 30%, rgb(' + c[0].join() + '), rgb(' + c[1].join() + ') 55%, rgb(' + c[2].join() + '))';
  mk('l-ball', BALLS, ballOpen, 'ball', b => b.name, b => 'radial-gradient(circle at 35% 30%, rgb(' + b.c[0].join() + '), rgb(' + b.c[1].join() + ') 55%, rgb(' + b.c[2].join() + ')) , #222', i => BALLS[i].un + ' PTS');
  mk('l-jer', JERSEYS, jerseyOpen, 'jersey', j => j.name, j => 'linear-gradient(' + j.j + ' 70%,' + j.t + ' 70% 80%,' + j.s + ' 80%)', i => JERSEYS[i].un + ' STARS');
  mk('l-court', THEMES, courtOpen, 'court', t => t.name, t => 'linear-gradient(' + t.sky + ' 50%,' + t.fl + ' 50%)', i => COURT_UN[i] + ' STARS');
  showScreen('lock');
}
function showResult() {
  const m = cfg.mode; $('rtitle').textContent = m === 'tour' ? (run.stars ? 'COURT CLEARED!' : 'TIME UP!') : (m === 'daily' ? 'DAILY DONE!' : 'TIME UP!');
  $('rscore').textContent = fmt(run.score);
  $('rstars').innerHTML = m === 'tour' ? '\u2605'.repeat(run.stars) + '<span class="o">' + '\u2605'.repeat(3 - run.stars) + '</span>' : '';
  $('rrec').textContent = run.rec ? 'NEW RECORD!' : (m === 'tour' && !run.stars ? 'NEED ' + cfg.tg[0] + ' PTS FOR 1 STAR' : '');
  $('r-m').textContent = run.makes + '/' + run.shots; $('r-s').textContent = run.swish; $('r-st').textContent = run.best;
  refreshResultBest();
  $('r-next').classList.toggle('gone', !(m === 'tour' && run.stars > 0 && cfg.idx < STAGES.length - 1));

  showScreen('res'); sfx.win();
}
function refreshResultBest() {
  if (!run || !cfg) return; const m = cfg.mode; let t = '';
  if (m === 'arcade') t = 'PERSONAL BEST ' + fmt(Store.get('ba', 0)); else if (m === 'daily') t = "TODAY'S BEST " + fmt((Store.get('db', { s: 0 }) || {}).s || 0) + ' • STREAK ' + (Store.get('dstreak', 0) | 0);
  else t = cfg.name + ' • GOALS ' + cfg.tg.join(' / ');

}

/* ---------- wiring ---------- */
function startArcade() { unlockAudio(); startRun(makeCfg('arcade', { th: sel.court, name: 'ARCADE' })); }
$('b-arc').onclick = () => { unlockAudio(); sfx.ui(); startArcade(); };
$('b-tour').onclick = () => { unlockAudio(); sfx.ui(); tourScreen(); };

$('b-lb').onclick = async () => { try { await snap.leaderboards.show(); } catch (e) {} };
$('r-lb').onclick = async () => { try { await snap.leaderboards.show(); } catch (e) {} };
$('t-back').onclick = () => { sfx.ui(); showScreen('home'); }; $('l-back').onclick = () => { sfx.ui(); showScreen('home'); }; $('s-back').onclick = () => { sfx.ui(); showScreen('home'); };
$('s-snd').onclick = () => { muted = !muted; Store.set('muted', muted); applySettings(); sfx.ui(); };
$('s-mus').onclick = () => { musicPref = !musicPref; Store.set('mus', musicPref); applySettings(); };
$('s-bm').onclick = () => { bm.on = !bm.on; Store.set('bm', bm.on); applySettings(); refreshHome(); };
$('snd').onclick = () => { muted = !muted; Store.set('muted', muted); applySettings(); unlockAudio(); };
$('pausebtn').onclick = () => { if (state === 'play' || state === 'count') { prevState = state; state = 'paused'; dragS = null; setTop(); showScreen('pause'); } };
let prevState = 'play';
$('p-resume').onclick = () => { hideScreens(); state = prevState; setTop(); };
$('p-restart').onclick = () => { startRun(cfg.mode === 'tour' ? stageCfg(cfg.idx) : cfg.mode === 'daily' ? dailyCfg() : makeCfg('arcade', { th: sel.court, name: 'ARCADE' })); };
$('p-menu').onclick = () => { goHome(); };

$('r-next').onclick = () => { sfx.ui(); startRun(stageCfg(cfg.idx + 1)); };
$('r-home').onclick = () => { sfx.ui(); goHome(); };
document.addEventListener('visibilitychange', () => {
  if (actx) { try { document.hidden ? actx.suspend() : actx.resume(); } catch (e) {} }
  if (document.hidden && (state === 'play' || state === 'count')) $('pausebtn').onclick();
});

/* ---------- input ---------- */
function toBuf(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * LW / r.width, y: (e.clientY - r.top) * LH / r.height }; }
cv.addEventListener('pointerdown', e => {
  unlockAudio(); if (state !== 'play' || !canShoot()) return;
  const p = toBuf(e); dragS = { x0: p.x, y0: p.y, x: p.x, y: p.y, id: e.pointerId }; try { cv.setPointerCapture(e.pointerId); } catch (er) {} e.preventDefault();
});
cv.addEventListener('pointermove', e => { if (!dragS || e.pointerId !== dragS.id) return; const p = toBuf(e); dragS.x = p.x; dragS.y = p.y; });
function endDrag(e, cancel) {
  if (!dragS || e.pointerId !== dragS.id) return; const d = dragS; dragS = null;
  if (cancel) return; if (!shoot(pullToP(d.y0 - d.y), d.x - d.x0)) { /* too short: cancel */ }
}
cv.addEventListener('pointerup', e => endDrag(e, false)); cv.addEventListener('pointercancel', e => endDrag(e, true));

/* ---------- boot ---------- */
function applySaved() {
  muted = !!Store.get('muted', false); bm.on = Store.get('bm', true) !== false; musicPref = Store.get('mus', true) !== false;
  const s = Store.get('sel', null); if (s) { sel.ball = s.ball | 0; sel.jersey = s.jersey | 0; sel.court = s.court | 0; }
  if (!ballOpen(sel.ball)) sel.ball = 0; if (!jerseyOpen(sel.jersey)) sel.jersey = 0; if (!courtOpen(sel.court)) sel.court = 0;
  bgCache = null; applySettings();
}
const _setMusic = setMusic; setMusic = on => _setMusic(on && musicPref);
async function bootSnap() {
  try { if (window.snapchat) { snap = window.snapchat; await snap.init(); await Store.load(); } } catch (e) { snap = null; }
  try { if (can('storage')) { const i = await snap.storage.getInfo(); stMode = i && i.persistenceMode; } } catch (e) {}
  applySaved(); refreshHome(); refreshSettingsNote(); loadBitmoji();
}
applySaved(); resize(); goHome();
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  if (!document.hidden) { try { update(dt); render(); } catch (e) { if (!loop.err) { loop.err = 1; console.error(e); } } }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
if (document.readyState === 'complete') bootSnap(); else window.addEventListener('load', bootSnap);

window.__hb = {
  get state() { return state; }, get run() { return run; }, get cfg() { return cfg; }, get ball() { return ball; }, hoop, player,
  sim: (sec, k) => { botOn = k; for (let i = 0; i < sec * 60; i++) update(1 / 60); botOn = false; }, sweet: sweetInfo, shoot, PULL, LH: () => LH, SC: () => SC, startRun, stageCfg, dailyCfg, makeCfg, finish: () => { run.timeUp = true; run.time = 0; }, canShoot,
  STAGES: () => STAGES.length, D, ui: id => !$(id).classList.contains('hidden'), sel, Store, setBot: v => { botOn = v; }, bot: botAct, ghosts: () => ghosts.length, bmSet: img => { bm.img = img; bm.status = 'ready'; refreshHome(); },
};
})();
